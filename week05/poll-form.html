<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Innocent Saize | WDD 130</title>
    <meta name="description"
      content="full course to learn all software development tools and concepts such as html, css.">
    <meta name="author" content="Saize Innocent">
    <link rel="stylesheet" href="styles/poll-form.css">
</head>

<body>
    <header>
        <h1>Poll Form</h1>
    </header>
    <main>
        <form>
            <div class="form-item column2">
            <label for="fullname">Full Name:</label>
            <input type="text" id="fullname" name="fullname" required>
            </div>

            <div class="form-item column2">
            <label> Email: <input type="email" id="useremail" name="useremail" required></label>
            </div>

            <div class="form-item">
            <label for="quantity">Select Quantity</label>
            <select name="quantity" id="quantity">
                <option value="1">One</option>
                <option value="2">Two</option>
                <option value="3">Three</option>
            </select>
            </div>

            <div class="form-item">
            <label for="browser">What is internet browser?</label>
            <select id="browser" name="browser">
                <option value="chrome">Chrome</option>
                <option value="edge">Edge</option>
                <option value="Brave">Brave</option>
                <option value="firefox">Fire Fox</option>
                <option value="other">Other</option>

                <label for="pet">Do you have a household pet?</label>
                <input type="checkbox" id="pet" name="pet">

                <label for="feedback">List the places you have lived:</label>
                <textarea id="feedback" name="feedback" rows="4"
                  placeholder="Stillwater, Florida Armtedam, Timbuktu Mali"></textarea>

            </select>
            </div>
            <button type="button">Submit Poll</button>


        </form>
    </main>
    <footer>
        <p>©️2026 🌴Innocent Saize 🌴 Manicaland, Zimbabwe</p>
    </footer>


</body>
