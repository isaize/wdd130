<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Innocent Saize | WDD 130</title>
    <meta name="description"
      content="full course to learn all software development tools and concepts such as html, css.">
    <meta name="author" content="Saize Innocent">
    <link rel="stylesheet" href="styles/quiz.css">
</head>

<body>
    <main class="box">
        <h1>✅ Basic HTML and CSS Quiz</h1>
        <form class="box">

            <div class="quiz-item box">
                <label for="q1">What does CSS stands for?</label>
                <input type="text" id=" q1" name="q1">
            </div>

            <div class="quiz-item box">
                <label for="q2">How are id and class selected in css?</label>
                <textarea id=" q2" name="q2"></textarea>
            </div>

            <div class="quiz-item box">
                <label for="q3">Which of the following is a valid css comment?</label>
                <select id=" q3" name="q3">
                    <option value="" selected disabled>Choose one... </option>
                    <option value="a">A. &lt; !-- this is a comment--&gt;</option>
                    <option value="b">B. /* this is a comment */</option>
                    <option value="c">C. // this is a comment</option>
                </select>
            </div>

            <div class="quiz-item box">
                <label for="q4">What is the bottom margin given the following declaration?</label>
                <code class="box">margin: 10px 5px 15px</code>
                <input type="number" id=" q4" name="q4"></input>

            </div>
            <button type="submit">Submit My Quiz for Grading</button>

        </form>

    </main>

</body>
